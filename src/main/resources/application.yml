spring:
  application:
    name: stream-processor
  datasource:
    url: jdbc:sqlite:${output.database.path}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# Kafka Configuration
kafka:
  bootstrap-servers: kafka:29092
  topics:
    page-views: page_views
    ad-clicks: ad_clicks
  consumer:
    group-id: stream-processor-group
    concurrency: 3  # Number of concurrent consumer threads (one per partition)

# Output Configuration
output:
  database:
    path: ./output/attributed_page_views.db
    journal-mode: WAL
    synchronous: FULL
    busy-timeout-ms: 5000
    click-state-migration-interval-ms: 60000

# Watermark Configuration
watermark:
  allowed-lateness-minutes: 2

# Processed input history configuration
processed-input-history:
  migration-interval-ms: 86400000
  migration-batch-size: 500

# Logging Configuration
logging:
  level:
    root: INFO
    com.ebay.challenge.streamprocessor: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ./logs/stream-processor.log
